services:
  mikrotik-devicefinder:
    build: .
    container_name: mikrotik-devicefinder
    restart: unless-stopped
    # network_mode host, App bindet strikt auf 127.0.0.1 - nur ueber einen
    # vorgelagerten Reverse-Proxy (siehe examples/reverse-proxy.Caddyfile.example)
    # von aussen erreichbar, nicht direkt. Bewusst NICHT auf ein Bridge-Netz
    # umgestellt: unser eigenes Deployment haengt an einem geteilten,
    # ebenfalls per network_mode: host laufenden Reverse-Proxy, der Apps nur
    # ueber "localhost:<port>" erreicht. Wer keinen solchen Proxy im selben
    # Netzwerk-Namespace hat, sollte stattdessen ein normales Bridge-Netz mit
    # "ports: [\"127.0.0.1:8090:8090\"]" verwenden - isoliert staerker.
    network_mode: host
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8090"]
    environment:
      - TZ=Europe/Berlin
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
